<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mini Royale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #e8e8e8;
    font-size: 14px; text-shadow: 1px 1px 2px #000; pointer-events: none;
    line-height: 1.5;
  }
  #hud .hp { color: #4ade80; }
  #hud .alive { color: #facc15; }
  #hud .zone { color: #60a5fa; }
  #msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 28px; font-weight: bold; text-align: center;
    text-shadow: 2px 2px 6px #000; pointer-events: none; opacity: 0;
    transition: opacity 0.3s;
  }
  #msg.show { opacity: 1; }
  #minimap {
    position: fixed; top: 12px; right: 12px;
    border: 2px solid #444; background: rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hp">HP: <span id="hp">100</span></div>
  <div class="alive">Alive: <span id="alive">30</span></div>
  <div class="zone">Zone: <span id="zone">aman</span></div>
  <div>Ammo: <span id="ammo">30</span> | Medkit: <span id="meds">0</span></div>
</div>
<div id="msg"></div>
<canvas id="minimap" width="180" height="180"></canvas>

<script>
// ============ CORE SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// World lebih besar dari layar — kamera follow player
const WORLD = { w: 3000, h: 3000 };

// ============ INPUT ============
const keys = {};
const mouse = { x: 0, y: 0, down: false };
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);

// ============ ENTITIES ============
const player = {
  x: WORLD.w / 2, y: WORLD.h / 2,
  vx: 0, vy: 0,
  hp: 100, maxHp: 100,
  speed: 3.2,
  radius: 16,
  ammo: 30, meds: 0,
  alive: true,
  angle: 0,
  cooldown: 0
};

const bullets = [];
const bots = [];
const loots = [];
const particles = [];

// Zone (safe circle yang menyusut)
const zone = {
  x: WORLD.w / 2, y: WORLD.h / 2,
  radius: 1400,
  targetRadius: 1400,
  nextShrink: 15000,
  shrinkRate: 0.15,
  phase: 0
};

const BOT_COUNT = 29;

function spawnBots() {
  for (let i = 0; i < BOT_COUNT; i++) {
    let x, y, tries = 0;
    do {
      x = Math.random() * WORLD.w;
      y = Math.random() * WORLD.h;
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 600 && tries < 50);
    bots.push({
      x, y, vx: 0, vy: 0,
      hp: 100, maxHp: 100,
      radius: 16, speed: 1.8 + Math.random() * 0.8,
      alive: true, angle: 0, cooldown: 0,
      aimError: 0.15 + Math.random() * 0.2,
      aggro: 500,
      wanderAngle: Math.random() * Math.PI * 2,
      wanderTimer: 0
    });
  }
}
spawnBots();

function spawnLoot() {
  const types = ['ammo', 'med', 'ammo', 'med', 'ammo'];
  for (let i = 0; i < 60; i++) {
    loots.push({
      x: Math.random() * WORLD.w,
      y: Math.random() * WORLD.h,
      type: types[Math.floor(Math.random() * types.length)],
      taken: false
    });
  }
}
spawnLoot();

// ============ BUILDINGS (obstacles) ============
const buildings = [];
for (let i = 0; i < 40; i++) {
  const w = 80 + Math.random() * 200;
  const h = 80 + Math.random() * 200;
  buildings.push({
    x: Math.random() * (WORLD.w - w),
    y: Math.random() * (WORLD.h - h),
    w, h
  });
}

// ============ CAMERA ============
const camera = { x: 0, y: 0 };
function updateCamera() {
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
  camera.x = Math.max(0, Math.min(WORLD.w - W, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - H, camera.y));
  if (WORLD.w < W) camera.x = (WORLD.w - W) / 2;
  if (WORLD.h < H) camera.y = (WORLD.h - H) / 2;
}

// ============ COLLISION ============
function collidesWithBuilding(x, y, r) {
  for (const b of buildings) {
    const cx = Math.max(b.x, Math.min(x, b.x + b.w));
    const cy = Math.max(b.y, Math.min(y, b.y + b.h));
    if (Math.hypot(x - cx, y - cy) < r) return true;
  }
  return false;
}

function tryMove(ent, dx, dy) {
  if (!collidesWithBuilding(ent.x + dx, ent.y, ent.radius)) ent.x += dx;
  if (!collidesWithBuilding(ent.x, ent.y + dy, ent.radius)) ent.y += dy;
  ent.x = Math.max(ent.radius, Math.min(WORLD.w - ent.radius, ent.x));
  ent.y = Math.max(ent.radius, Math.min(WORLD.h - ent.radius, ent.y));
}

// ============ SHOOTING ============
function shoot(shooter, targetAngle, isPlayer) {
  if (shooter.cooldown > 0) return;
  if (isPlayer && player.ammo <= 0) return;
  shooter.cooldown = isPlayer ? 6 : 25 + Math.random() * 20;
  if (isPlayer) player.ammo--;

  const spread = isPlayer ? 0.02 : shooter.aimError;
  const a = targetAngle + (Math.random() - 0.5) * spread;
  const speed = 14;
  bullets.push({
    x: shooter.x + Math.cos(a) * shooter.radius,
    y: shooter.y + Math.sin(a) * shooter.radius,
    vx: Math.cos(a) * speed,
    vy: Math.sin(a) * speed,
    owner: isPlayer ? 'player' : 'bot',
    life: 90,
    damage: isPlayer ? 12 : 8
  });

  // muzzle particle
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: shooter.x + Math.cos(a) * shooter.radius,
      y: shooter.y + Math.sin(a) * shooter.radius,
      vx: Math.cos(a + (Math.random() - 0.5) * 0.6) * 4,
      vy: Math.sin(a + (Math.random() - 0.5) * 0.6) * 4,
      life: 12, color: '#fbbf24'
    });
  }
}

// ============ UPDATE ============
function update(dt) {
  if (!player.alive) return;
  const now = performance.now();

  // --- PLAYER MOVEMENT ---
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy) || 1;
  dx = dx / len * player.speed;
  dy = dy / len * player.speed;
  tryMove(player, dx, dy);

  // Aim
  player.angle = Math.atan2(
    mouse.y + camera.y - player.y,
    mouse.x + camera.x - player.x
  );

  if (player.cooldown > 0) player.cooldown--;

  // Shoot
  if (mouse.down) shoot(player, player.angle, true);

  // Reload (R key = instant reload from loot pool — no reload anim, prototype)
  if (keys['r'] && player.ammo < 30) {
    player.ammo = 30;
    keys['r'] = false;
  }

  // Medkit (F key)
  if (keys['f'] && player.meds > 0 && player.hp < player.maxHp) {
    player.meds--;
    player.hp = Math.min(player.maxHp, player.hp + 40);
    keys['f'] = false;
  }

  // --- BOTS ---
  for (const bot of bots) {
    if (!bot.alive) continue;
    if (bot.cooldown > 0) bot.cooldown--;

    const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);

    // Outside zone? move toward zone center
    const distToZone = Math.hypot(bot.x - zone.x, bot.y - zone.y);
    if (distToZone > zone.radius - 50) {
      const a = Math.atan2(zone.y - bot.y, zone.x - bot.x);
      tryMove(bot, Math.cos(a) * bot.speed, Math.sin(a) * bot.speed);
      bot.angle = a;
      continue;
    }

    if (distToPlayer < bot.aggro && player.alive) {
      // Chase & shoot player
      const a = Math.atan2(player.y - bot.y, player.x - bot.x);
      bot.angle = a;
      if (distToPlayer > 150) {
        tryMove(bot, Math.cos(a) * bot.speed, Math.sin(a) * bot.speed);
      }
      if (distToPlayer < 500) shoot(bot, a, false);
    } else {
      // Wander
      bot.wanderTimer--;
      if (bot.wanderTimer <= 0) {
        bot.wanderAngle = Math.random() * Math.PI * 2;
        bot.wanderTimer = 60 + Math.random() * 120;
      }
      tryMove(bot,
        Math.cos(bot.wanderAngle) * bot.speed * 0.6,
        Math.sin(bot.wanderAngle) * bot.speed * 0.6
      );
      bot.angle = bot.wanderAngle;
    }
  }

  // --- BULLETS ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life--;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }
    if (collidesWithBuilding(b.x, b.y, 2)) { bullets.splice(i, 1); continue; }

    if (b.owner === 'player') {
      for (const bot of bots) {
        if (!bot.alive) continue;
        if (Math.hypot(bot.x - b.x, bot.y - b.y) < bot.radius) {
          bot.hp -= b.damage;
          bullets.splice(i, 1);
          hitParticles(b.x, b.y, '#ef4444');
          if (bot.hp <= 0) { bot.alive = false; checkWin(); }
          break;
        }
      }
    } else {
      if (player.alive && Math.hypot(player.x - b.x, player.y - b.y) < player.radius) {
        player.hp -= b.damage;
        bullets.splice(i, 1);
        hitParticles(b.x, b.y, '#ef4444');
        if (player.hp <= 0) { player.alive = false; showMsg('GAME OVER'); }
      }
    }
  }

  // --- PARTICLES ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // --- LOOT PICKUP ---
  for (const l of loots) {
    if (l.taken) continue;
    if (Math.hypot(l.x - player.x, l.y - player.y) < player.radius + 12) {
      l.taken = true;
      if (l.type === 'ammo') player.ammo = Math.min(30, player.ammo + 30);
      else player.meds++;
    }
  }

  // --- ZONE ---
  if (now > zone.nextShrink) {
    zone.phase++;
    zone.targetRadius = Math.max(80, zone.radius - 300);
    zone.nextShrink = now + 15000;
    showMsg(`ZONE MENYUSUT — Fase ${zone.phase + 1}`);
  }
  if (zone.radius > zone.targetRadius) {
    zone.radius -= zone.shrinkRate;
  }

  // Zone damage
  const pd = Math.hypot(player.x - zone.x, player.y - zone.y);
  if (pd > zone.radius) {
    player.hp -= 0.05;
    if (player.hp <= 0 && player.alive) { player.alive = false; showMsg('MATI DI LUAR ZONE'); }
  }

  updateCamera();
  updateHUD();
}

function hitParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 15, color
    });
  }
}

function checkWin() {
  const alive = bots.filter(b => b.alive).length;
  if (alive === 0 && player.alive) showMsg('WINNER WINNER — CHICKEN DINNER');
}

let msgTimeout;
function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(() => el.classList.remove('show'), 2000);
}

function updateHUD() {
  document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
  document.getElementById('alive').textContent = bots.filter(b => b.alive).length + (player.alive ? 1 : 0);
  document.getElementById('ammo').textContent = player.ammo;
  document.getElementById('meds').textContent = player.meds;
  const pd = Math.hypot(player.x - zone.x, player.y - zone.y);
  document.getElementById('zone').textContent = pd > zone.radius ? 'LUAR ZONE' : 'aman';
}

// ============ RENDER ============
function render() {
  // Background
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Grid
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  const gridSize = 100;
  const startX = Math.floor(camera.x / gridSize) * gridSize;
  const startY = Math.floor(camera.y / gridSize) * gridSize;
  for (let x = startX; x < camera.x + W + gridSize; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + H); ctx.stroke();
  }
  for (let y = startY; y < camera.y + H + gridSize; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + W, y); ctx.stroke();
  }

  // Zone
  ctx.beginPath();
  ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 10]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Buildings
  for (const b of buildings) {
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Loot
  for (const l of loots) {
    if (l.taken) continue;
    ctx.fillStyle = l.type === 'ammo' ? '#fbbf24' : '#4ade80';
    ctx.beginPath();
    ctx.arc(l.x, l.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  }

  // Bots
  for (const bot of bots) {
    if (!bot.alive) continue;
    ctx.save();
    ctx.translate(bot.x, bot.y);
    ctx.rotate(bot.angle);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, bot.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(bot.radius - 4, -3, 14, 6);
    ctx.restore();
    // HP bar
    ctx.fillStyle = '#000';
    ctx.fillRect(bot.x - 20, bot.y - 28, 40, 4);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(bot.x - 20, bot.y - 28, 40 * (bot.hp / bot.maxHp), 4);
  }

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = b.owner === 'player' ? '#fef08a' : '#fca5a5';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 15;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player
  if (player.alive) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#166534';
    ctx.fillRect(player.radius - 4, -3, 16, 6);
    ctx.restore();
  }

  ctx.restore();

  // --- MINIMAP ---
  mctx.fillStyle = 'rgba(0,0,0,0.7)';
  mctx.fillRect(0, 0, 180, 180);
  const scale = 180 / WORLD.w;
  mctx.fillStyle = '#3a3a3a';
  for (const b of buildings) {
    mctx.fillRect(b.x * scale, b.y * scale, b.w * scale, b.h * scale);
  }
  mctx.strokeStyle = '#60a5fa';
  mctx.lineWidth = 1;
  mctx.beginPath();
  mctx.arc(zone.x * scale, zone.y * scale, zone.radius * scale, 0, Math.PI * 2);
  mctx.stroke();
  mctx.fillStyle = '#ef4444';
  for (const bot of bots) {
    if (!bot.alive) continue;
    mctx.fillRect(bot.x * scale - 1, bot.y * scale - 1, 2, 2);
  }
  if (player.alive) {
    mctx.fillStyle = '#4ade80';
    mctx.beginPath();
    mctx.arc(player.x * scale, player.y * scale, 3, 0, Math.PI * 2);
    mctx.fill();
  }

  // Crosshair
  if (player.alive) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 10, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y);
    ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 10, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 10); ctx.lineTo(mouse.x, mouse.y - 4);
    ctx.moveTo(mouse.x, mouse.y + 4); ctx.lineTo(mouse.x, mouse.y + 10);
    ctx.stroke();
  }
}

// ============ LOOP ============
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(50, now - lastTime);
  lastTime = now;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

showMsg('MINI ROYALE — WASD gerak, klik tembak, E ambil loot');
setTimeout(() => document.getElementById('msg').classList.remove('show'), 3000);
loop();
</script>
</body>
  </html>
